description: 'Treeline Biosciences, Inc. develops medicines by matching disease targets with proven drug approaches, using in‑house R&D, computational tools, and machine‑learning models. It focuses on oncology, immunology, and neurology, creating development candidates such as inhibitors, protein degraders, and antibody‑drug conjugates for serious diseases. The company conducts research at its U.S. and EU facilities and advances only the most promising candidates to human testing.'

